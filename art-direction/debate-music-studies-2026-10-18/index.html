<script type="module">

const $=s=>document.querySelector(s), audio=$('#audio'), lang=$('#lang');

function update(){if(!data)return;const t=audio.currentTime;const cue=[...data.turns].reverse().find(c=>t>=c.start&&t<c.end);const mm=String(Math.floor(t/60)).padStart(2,'0'),ss=(t%60).toFixed(1).padStart(4,'0');$('#current').textContent=mm+':'+ss+' · '+primaryText(cue?roleNames[cue.speaker]:bi('留白／转接','Pause / transition'));}
