<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Hamilton · 属性圆盘三版 / Attribute Dial Studies</title>
  <link rel="stylesheet" href="./studies.css">
</head>
<body>
  <main>
    <header class="page-head">
      <div><p class="eyebrow">HAMILTON · UI STUDIES / 03</p><h1 data-copy="title"></h1><p class="intro" data-copy="intro"></p></div>
      <button id="language" class="language">English</button>
    </header>
    <section class="workspace">
      <div class="comparisons" id="comparisons"></div>
      <aside class="controls">
        <div class="controls-head"><h2 data-copy="live"></h2><button id="reset" data-copy="reset"></button></div>
        <div class="presets"><button data-preset="arrival" data-copy="arrival"></button><button data-preset="camp" data-copy="camp"></button><button data-preset="equal" data-copy="equal"></button></div>
        <div id="sliders"></div>
        <label class="lock-option"><input type="checkbox" id="locked" checked><span data-copy="lock"></span></label>
        <div class="backgrounds"><span data-copy="background"></span><button data-background="scene" data-copy="scene"></button><button data-background="checker" data-copy="checker"></button><button data-background="light" data-copy="light"></button></div>
        <label class="size-option"><input type="checkbox" id="actual-size"><span data-copy="size"></span></label>
        <div class="legend"><div><span class="swatch empty"></span><p data-copy="empty"></p></div><div><span class="swatch locked"></span><p data-copy="locked"></p></div></div>
        <p class="note" data-copy="note"></p>
      </aside>
    </section>
    <footer><span data-copy="footer"></span><a href="./comparison.png" download data-copy="download"></a></footer>
  </main>
  <dialog id="detail"><button id="close-detail" aria-label="关闭 / Close">×</button><p class="eyebrow" id="detail-code"></p><h2 id="detail-name"></h2><strong id="detail-value"></strong><p id="detail-copy"></p></dialog>
  <script type="module" src="./studies.mjs"></script>
</body>
</html>
